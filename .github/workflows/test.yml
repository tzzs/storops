name: test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gdu (Linux/macOS only -- the preferred scan backend, du is the fallback)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y gdu
          else
            brew install gdu
          fi

      - name: Install storops (editable) + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run unit + integration tests
        run: pytest tests/unit tests/integration -q
