name: skillhub-publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (skillhub publish --dry-run) -- skip the real publish"
        type: boolean
        default: true
      changelog:
        description: "Changelog message for a manual publish (ignored when dry_run is true)"
        type: string
        default: "Manual re-publish"

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SkillHub CLI
        run: curl -fsSL https://skillhub.cn/install/install.sh | bash -s -- --cli-only

      - name: Add SkillHub CLI to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify installation
        run: skillhub --version

      - name: Log in to SkillHub
        run: skillhub login --key "${{ secrets.SKILLHUB_API_KEY }}" --host https://api.skillhub.cn

      - name: Confirm identity
        run: skillhub auth whoami

      - name: Sync SKILL.md version with the release manifest
        if: github.event_name == 'release'
        run: |
          version="$(jq -r '.["."]' .release-please-manifest.json)"
          sed -i "s/^version: .*/version: ${version}/" SKILL.md
          grep -qx "version: ${version}" SKILL.md || { echo "::error::SKILL.md version was not updated to ${version}"; exit 1; }

      - name: Dry-run publish (format check)
        run: skillhub publish . --dry-run

      - name: Require a green test run on this commit before publishing
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.sha }}"
          repo="${{ github.repository }}"
          echo "Waiting for the 'test' workflow's result on commit $sha..."
          for i in $(seq 1 40); do
            conclusion="$(gh api "repos/$repo/actions/workflows/test.yml/runs?head_sha=$sha" \
              --jq '[.workflow_runs[]] | sort_by(.run_started_at) | last | .conclusion // "pending"')"
            if [ "$conclusion" = "pending" ] || [ "$conclusion" = "null" ] || [ -z "$conclusion" ]; then
              echo "  ($i/40) not finished yet, waiting 15s..."
              sleep 15
              continue
            fi
            echo "test workflow conclusion: $conclusion"
            if [ "$conclusion" != "success" ]; then
              echo "::error::test workflow did not succeed on commit $sha (conclusion: $conclusion) -- refusing to publish"
              exit 1
            fi
            exit 0
          done
          echo "::error::timed out waiting for the test workflow to finish on commit $sha -- refusing to publish"
          exit 1

      - name: Publish to SkillHub
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_CHANGELOG: ${{ inputs.changelog }}
        run: |
          changelog="${RELEASE_NAME:-${RELEASE_TAG:-$MANUAL_CHANGELOG}}"
          skillhub publish . --changelog "$changelog"
