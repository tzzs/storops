name: skillhub-publish

# Triggers off release-please's completion rather than `release: published`
# directly: release-please-action creates the release using GITHUB_TOKEN, and
# GitHub never fires downstream `release`/`push`-triggered workflows for
# content created by GITHUB_TOKEN (anti-recursion safeguard) -- so `on:
# release` here would simply never run. workflow_run is exempt from that
# restriction because it reacts to the workflow finishing, not to the event
# release-please's own token produced.
on:
  workflow_run:
    workflows: ["release-please"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (skillhub publish --dry-run) -- skip the real publish"
        type: boolean
        default: true
      changelog:
        description: "Changelog message for a manual publish (ignored when dry_run is true)"
        type: string
        default: "Manual re-publish"

permissions:
  contents: read
  actions: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - name: Did release-please cut a release for this commit?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual trigger -- will publish"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          repo="${{ github.repository }}"
          head_sha="${{ github.event.workflow_run.head_sha }}"
          latest_tag="$(gh api "repos/$repo/releases" --jq '.[0].tag_name // empty')"
          if [ -z "$latest_tag" ]; then
            echo "no releases exist yet -- nothing to publish"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag_sha="$(gh api "repos/$repo/git/refs/tags/$latest_tag" --jq '.object.sha')"
          if [ "$tag_sha" = "$head_sha" ]; then
            echo "release-please cut $latest_tag for commit $head_sha -- will publish"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          else
            echo "latest release $latest_tag points at $tag_sha, not $head_sha -- this run didn't cut a release, skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Install SkillHub CLI
        run: curl -fsSL https://skillhub.cn/install/install.sh | bash -s -- --cli-only

      - name: Add SkillHub CLI to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify installation
        run: skillhub --version

      - name: Log in to SkillHub
        run: skillhub login --key "${{ secrets.SKILLHUB_API_KEY }}" --host https://api.skillhub.cn

      - name: Confirm identity
        run: skillhub auth whoami

      - name: Package skill content
        run: |
          zip -rq /tmp/storops-skill.zip . \
            -x '.git/**' -x '.github/**' -x '.claude-plugin/**' -x 'tests/**' \
            -x '.gitignore' -x '.release-please-manifest.json' -x 'release-please-config.json'
          echo "Packaged files:"
          unzip -l /tmp/storops-skill.zip

      - name: Require a green test run on this commit before publishing
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.event.workflow_run.head_sha }}"
          repo="${{ github.repository }}"
          echo "Waiting for the 'test' workflow's result on commit $sha..."
          for i in $(seq 1 40); do
            conclusion="$(gh api "repos/$repo/actions/workflows/test.yml/runs?head_sha=$sha" \
              --jq '[.workflow_runs[]] | sort_by(.run_started_at) | last | .conclusion // "pending"')"
            if [ "$conclusion" = "pending" ] || [ "$conclusion" = "null" ] || [ -z "$conclusion" ]; then
              echo "  ($i/40) not finished yet, waiting 15s..."
              sleep 15
              continue
            fi
            echo "test workflow conclusion: $conclusion"
            if [ "$conclusion" != "success" ]; then
              echo "::error::test workflow did not succeed on commit $sha (conclusion: $conclusion) -- refusing to publish"
              exit 1
            fi
            exit 0
          done
          echo "::error::timed out waiting for the test workflow to finish on commit $sha -- refusing to publish"
          exit 1

      - name: Dry-run publish (format check)
        run: |
          version="$(jq -r '.["."]' .release-please-manifest.json)"
          skillhub publish /tmp/storops-skill.zip --dry-run --version "$version"

      - name: Publish to SkillHub
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
          MANUAL_CHANGELOG: ${{ inputs.changelog }}
        run: |
          version="$(jq -r '.["."]' .release-please-manifest.json)"
          changelog="${RELEASE_TAG:-$MANUAL_CHANGELOG}"
          skillhub publish /tmp/storops-skill.zip --changelog "$changelog" --version "$version"
